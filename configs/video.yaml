# Runtime settings shared by the classifier and unchanged annotation tool.
backend: hailo
device: cpu
models_directory: ..
acquisition_directory: ../data/acquisition
production_directory: ../runs
zones_file: ../data/acquisition/zones.json
retention_runs: 3

detector:
  weights: yolo/yolo.pth  # Optional compiled CPU model for local development.
  hef: yolo/yolo.hef
  hef_labels: yolo/classes.txt
  image_size: 640
  confidence: 0.15
  max_detections: 100
  preprocessing: false
  excluded_labels: [person, refrigerator]
classifier:
  checkpoint: vit/vit.pth  # Exported by GD_vision/compile/export.py; labels are inside.
  confidence: 0.0
  crops_per_track: 3
tracking:
  sample_fps: 5
  stable_frames: 2
  dwell_seconds: 0.2
  max_gap_seconds: 1.0
  minimum_movement: 0.03
  max_tracks: 300
video:
  max_duration_seconds: 200
  max_upload_mb: 1024
  max_pixels: 16777216
  proxy_width: 1280
  proxy_preset: veryfast
cameras:
  fridge:
    inside: null
    outside: null
  door:
    inside: null
    outside: null
# Used only by the annotation tool's existing Record button.
capture:
  fridge: {kind: rpicam, camera: 0, width: 1280, height: 720, fps: 30}
  door: {kind: rpicam, camera: 1, width: 1280, height: 720, fps: 30}
